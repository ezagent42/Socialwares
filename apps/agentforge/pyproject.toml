[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge Socialware App — Agent 生命周期管理 + 多平台适配"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
