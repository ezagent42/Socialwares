domain: taskarena
api_url: http://localhost:8001
language: zh

roles:
  R1:
    name: admin
    label: "管理员"
    permissions: [propose, assign, review, close, force_resolve]
  R2:
    name: submitter
    label: "提交者"
    permissions: [propose, submit, update]
  R3:
    name: reviewer
    label: "审核者"
    permissions: [review, comment]

flow:
  name: task_lifecycle
  states: [draft, submitted, under_review, approved, rejected, closed]
  transitions:
    - from: draft
      to: submitted
      action: propose
      role: R2
    - from: submitted
      to: under_review
      action: review
      role: R3
    - from: under_review
      to: approved
      action: approve
      role: R3
    - from: under_review
      to: rejected
      action: reject
      role: R3
    - from: rejected
      to: submitted
      action: resubmit
      role: R2
    - from: approved
      to: closed
      action: close
      role: R1

commitments:
  C1:
    description: "审核者在任务提交后 72h 内完成审核"
    trigger_state: submitted
    deadline_hours: 72
    escalation_role: R1
  C2:
    description: "管理员在 C1 违约后 24h 内 force_resolve"
    trigger: C1_violation     # 由 C1 超时触发，不是状态触发
    deadline_hours: 24
    escalation_role: R1

arena:
  min_members: 2
  scope: room
