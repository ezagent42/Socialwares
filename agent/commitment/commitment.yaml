# Constraints — bind to flow edges (state machine transitions or direct actions)
#
# Transition constraints: enforce rules on state machine edges
# Action constraints: postconditions on direct actions
#
# Violations are written to .runtime/data/violations/ by evolver's diagnose.py.
# UserPromptSubmit (log_prompt.sh) + PreToolUse (log_tool.sh) hooks capture
# prompts and tool calls for analysis — they do NOT check violations.
#
# Flow: hooks record data → diagnose.py analyzes → writes violations
# The violations API (GET /violations) reads these files.

# Transition constraints — bind to flow.yaml state machine edges
transition_constraints: {}
  # Example:
  # C1:
  #   description: "Review within 72h"
  #   on: { flow: F1, from: submitted, action: review }
  #   type: time
  #   deadline: 72h
  #   on_violation:
  #     trigger_action: force_resolve
  #     trigger_role: admin
  #
  # C2:
  #   description: "Review must include justification"
  #   on: { flow: F1, from: under_review, action: approve }
  #   type: quality
  #   postcondition: "response must contain 'reason' field"
  #   on_violation:
  #     trigger_action: reject
  #     reason: "insufficient justification"

# Action constraints — postconditions on direct actions
action_constraints:
  C1:
    description: "Health check returns ok"
    on: { action: check_health }
    type: postcondition
    expected: '{"status": "ok"}'
