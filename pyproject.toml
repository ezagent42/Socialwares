[project]
name = "socialwares"
version = "0.2.0"
description = "Framework for building Socialware Apps"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
socialwares = "socialwares.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
claude = ["claude-agent-sdk>=0.1.16"]
codex = ["openai-agents>=0.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialwares"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
