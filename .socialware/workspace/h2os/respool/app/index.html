<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResPool</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 12px 20px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #111;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

header .status {
  font-size: 12px;
  color: #666;
}

header .status.connected { color: #4ade80; }
header .status.error { color: #f87171; }

header select {
  margin-left: auto;
  background: #1a1a1a;
  color: #ccc;
  border: 1px solid #333;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user {
  align-self: flex-end;
  background: #1d4ed8;
  color: #fff;
  border-bottom-right-radius: 2px;
}

.msg.agent {
  align-self: flex-start;
  background: #1a1a1a;
  border: 1px solid #333;
  border-bottom-left-radius: 2px;
}

.msg.system {
  align-self: center;
  background: transparent;
  color: #666;
  font-size: 12px;
  padding: 4px 0;
}

.msg.error {
  align-self: center;
  background: #1c0a0a;
  border: 1px solid #7f1d1d;
  color: #fca5a5;
  font-size: 13px;
}

.msg.thinking {
  align-self: flex-start;
  background: transparent;
  color: #666;
  font-size: 13px;
  padding: 4px 0;
}

.msg code {
  background: #2a2a2a;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 13px;
}

.msg pre {
  background: #0d0d0d;
  padding: 8px 10px;
  border-radius: 4px;
  overflow-x: auto;
  margin: 6px 0;
  font-size: 13px;
}

#input-area {
  padding: 12px 20px;
  border-top: 1px solid #222;
  background: #111;
  display: flex;
  gap: 8px;
}

#input-area textarea {
  flex: 1;
  background: #1a1a1a;
  color: #e0e0e0;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  height: 44px;
  line-height: 1.4;
}

#input-area textarea:focus {
  outline: none;
  border-color: #555;
}

#input-area button {
  background: #1d4ed8;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0 20px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

#input-area button:hover { background: #2563eb; }
#input-area button:disabled { background: #333; color: #666; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>ResPool</h1>
  <span id="status" class="status">disconnected</span>
  <select id="role">
    <option value="default">default</option>
    <option value="admin">admin</option>
    <option value="dev">dev</option>
    <option value="evolver">evolver</option>
  </select>
</header>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="Ask ResPool..." rows="1"></textarea>
  <button id="send" disabled>Send</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const roleEl = document.getElementById('role');

let ws = null;
let currentAgentMsg = null;

function addMsg(type, text) {
  if (!text && type !== 'thinking') return;
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function connect() {
  if (ws) ws.close();

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/chat`);

  ws.onopen = () => {
    statusEl.textContent = 'connecting...';
    statusEl.className = 'status';
    ws.send(JSON.stringify({ type: 'init', role: roleEl.value }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    switch (msg.type) {
      case 'system':
        statusEl.textContent = `connected (${roleEl.value})`;
        statusEl.className = 'status connected';
        sendBtn.disabled = false;
        addMsg('system', msg.content);
        break;

      case 'status':
        if (msg.content === 'thinking') {
          currentAgentMsg = null;
          addMsg('thinking', '...');
        }
        break;

      case 'agent':
        // Remove thinking indicator
        const thinking = messagesEl.querySelector('.msg.thinking:last-child');
        if (thinking) thinking.remove();

        if (msg.content) {
          if (!currentAgentMsg) {
            currentAgentMsg = addMsg('agent', msg.content);
          } else {
            currentAgentMsg.textContent += msg.content;
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        break;

      case 'done':
        currentAgentMsg = null;
        sendBtn.disabled = false;
        inputEl.focus();
        break;

      case 'error':
        const thinkingErr = messagesEl.querySelector('.msg.thinking:last-child');
        if (thinkingErr) thinkingErr.remove();
        addMsg('error', msg.content);
        sendBtn.disabled = false;
        break;
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'disconnected';
    statusEl.className = 'status';
    sendBtn.disabled = true;
    addMsg('system', 'Connection closed. Switching role or refreshing will reconnect.');
  };

  ws.onerror = () => {
    statusEl.textContent = 'error';
    statusEl.className = 'status error';
  };
}

function send() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  addMsg('user', text);
  ws.send(JSON.stringify({ type: 'user_message', content: text }));
  inputEl.value = '';
  sendBtn.disabled = true;
}

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

roleEl.addEventListener('change', () => {
  addMsg('system', `Switching to ${roleEl.value}...`);
  connect();
});

// Auto-connect on load
connect();
</script>

</body>
</html>
