# Commitment — ResPool evaluation standards
#
# Each commitment defines what "good" looks like between two role-actions.
# Evaluated by evolver (diagnose.py + LLM judgment), NOT enforced at runtime.
#
# Data flow:
#   Hook logs (.runtime/data/prompts/) → diagnose.py → evolver judges → violations

commitments:
  C1:
    from: { role: default, action: request_allocation }
    to:   { role: default, action: list_allocations }
    condition: "newly created allocation appears in list_allocations within 5 seconds"
    on_violation: { role: evolver, action: evolve_session_diagnose }

  C2:
    from: { role: default, action: release_allocation }
    to:   { role: default, action: get_allocation }
    condition: "released allocation shows phase=released and invoice_amount calculated within 10 seconds"
    on_violation: { role: evolver, action: evolve_session_diagnose }

  C3:
    from: { role: default, action: request_allocation }
    to:   { role: default, action: estimate_cost }
    condition: "cost estimate presented to user before allocation is created"
    on_violation: null

  C4:
    from: { role: admin, action: approve_allocation }
    to:   { role: default, action: list_allocations }
    condition: "pending allocation approved within 24 hours of creation"
    on_violation: { role: admin, action: lease_reminder }

  C5:
    from: { role: default, action: request_allocation }
    to:   { role: default, action: release_allocation }
    condition: "active allocation with lease.end is released before or at expiration"
    on_violation: { role: default, action: lease_reminder }
