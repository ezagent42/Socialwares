# Flow definitions — action registry and state machines.
#
# ResPool resource pool management flows.
# Allocation lifecycle is declared here for Agent/evolver reference.
# State transitions are enforced server-side by OneSystem (violation returns 400).

flows:
  F1:
    name: allocation_lifecycle
    resource: allocation
    description: "Resource allocation from request to settlement"
    states: [pending, active, released, settled, disputed]
    transitions:
      - { from: pending,  action: approve_allocation,  to: active,   role: [admin] }
      - { from: active,   action: release_allocation,  to: released, role: [default] }
      - { from: released, action: settle_allocation,   to: settled,  role: [admin] }
      - { from: settled,  action: dispute_allocation,  to: disputed, role: [default] }
      - { from: disputed, action: settle_allocation,   to: settled,  role: [admin] }

direct_actions:
  # --- P1: basic ---
  - action: check_health
    role: [default, admin, dev, evolver]
    description: "Check app health status"

  - action: list_pools
    role: [default, admin, dev, evolver]
    description: "List available resource pools and capacity status"

  # --- P2: core allocation ---
  - action: search_resources
    role: [default, admin, dev, evolver]
    description: "Search resources by type, labels, capacity, or pricing"

  - action: request_allocation
    role: [default]
    description: "Create a resource allocation (amount, duration, purpose)"

  - action: list_allocations
    role: [default, admin, dev, evolver]
    description: "List allocations with optional phase/consumer filter"

  - action: get_allocation
    role: [default, admin, dev, evolver]
    description: "Get allocation details by name"

  - action: release_allocation
    role: [default]
    description: "Release an active allocation (triggers billing)"

  - action: estimate_cost
    role: [default, admin, dev, evolver]
    description: "Estimate cost for a potential allocation"

  # --- P3: monitoring ---
  - action: capacity_alert
    role: [default, admin, evolver]
    description: "Check resource pool capacity and alert on low availability"

  - action: lease_reminder
    role: [default, admin, evolver]
    description: "Check for expiring allocations and overdue pending approvals"

  # --- P4: extended ---
  - action: batch_allocate
    role: [default]
    description: "Allocate multiple resources in one request"

  - action: cost_report
    role: [default, admin, evolver]
    description: "Generate cost report for allocations"

  - action: recommend_resource
    role: [default, admin, evolver]
    description: "Recommend optimal resources based on requirements"

  # --- P5: admin management ---
  - action: approve_allocation
    role: [admin]
    description: "Approve a pending resource allocation"

  - action: settle_allocation
    role: [admin]
    description: "Mark a released allocation as settled (billing complete)"

  - action: dispute_allocation
    role: [default]
    description: "Dispute a settled allocation's billing"

  - action: manage_quota
    role: [admin]
    description: "View and manage resource allocation quotas"

  # --- infra ---
  - action: setup_claude
    role: [dev]
    description: "Configure Claude Code environment (agent-setup plugin, settings, hooks)"

  - { action: evolve_structure_check,  role: [evolver], description: "Check structural consistency of four primitives" }
  - { action: evolve_session_diagnose, role: [evolver], description: "Diagnose issues from runtime data" }
  - { action: evolve_api_check,        role: [evolver], description: "Run eval cases and report score" }
  - { action: evolve_improve,          role: [evolver], description: "Propose and apply four-primitive changes" }
  - { action: evolve_auto,             role: [evolver], description: "Run automated evolution loop (EvoSkill)" }
  - { action: inspect,                 role: [dev, evolver], description: "Show project structure and dev workflow" }
