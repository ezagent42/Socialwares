[project]
name = "task-review"
version = "0.1.0"
description = "Socialware App scaffolding template"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
claude = ["claude-code-sdk>=0.0.20"]
codex = ["openai-agents>=0.10.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
