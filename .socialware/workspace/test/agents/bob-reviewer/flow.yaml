direct_actions:
- action: check_health
  role:
  - default
  - reviewer
- action: create_task
  role:
  - default
- action: list_tasks
  role:
  - default
  - reviewer
- action: inspect
  role:
  - dev
  - evolver
- action: setup_claude
  role:
  - dev
- action: evolve_structure_check
  role:
  - evolver
- action: evolve_api_check
  role:
  - evolver
- action: evolve_session_diagnose
  role:
  - evolver
- action: evolve_improve
  role:
  - evolver
- action: evolve_auto
  role:
  - evolver
flows:
  task_lifecycle:
    resource: task
    states:
    - draft
    - submitted
    - reviewed
    - closed
    transitions:
    - action: submit_task
      from: draft
      role:
      - default
      to: submitted
    - action: review_task
      from: submitted
      role:
      - reviewer
      to: reviewed
    - action: close_task
      from: reviewed
      role:
      - default
      to: closed
