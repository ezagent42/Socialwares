[project]
name = "agentforge"
version = "0.1.0"
description = "Socialware App scaffolding template"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "sse-starlette>=3.3.3",
    "claude-agent-sdk>=0.1.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
codex = ["openai-agents>=0.10.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
