# Eval cases — standard conversation behaviors for this app.
# Each case defines: what the user says, what the agent should do, how to verify.
#
# Two types of eval:
#   api_check: direct HTTP call to verify endpoint works
#   conversation: what action should the agent take for a given input

# API-level checks (baseline — does the backend work?)
api_checks:
  - description: "Health check returns ok"
    method: GET
    endpoint: /health
    expected_status: 200
    expected_body: '{"status":"ok"}'

# Conversation-level checks (does the agent behave correctly?)
# These define standard input → expected behavior mappings.
# The evolver uses these to evaluate and improve agent skills.
conversation_checks:
  - input: "check health"
    expected_skill: check_health
    description: "Agent should use check_health skill"

