# Commitment — Trackable commitments / evaluation criteria
#
# Declarative definition: describes "what counts as meeting the standard",
# without prescribing "how to check".
# Execution method is determined by the App's Biz layer (API middleware / cron / eval scripts).
#
# Examples:
#
# commitments:
#   C1:
#     description: "Reviewer completes review within 72h after task submission"
#     metric: time_to_review
#     threshold: "72h"
#     debtor_role: reviewer
#     creditor_role: submitter
#
#   C2:
#     description: "Customer satisfaction ≥ 4.5 stars"
#     metric: customer_rating
#     threshold: ">=4.5"
#
#   C3:
#     description: "Complete at least 3 tasks per week"
#     metric: tasks_completed_per_week
#     threshold: ">=3"

commitments:
  code-reviewer-file-coverage:
    description: "完整读取用户指定文件的全部内容，不得截断或跳过"
    metric: file_read_completeness
    threshold: "100%"
    debtor_role: code-reviewer

  code-reviewer-issue-accuracy:
    description: "报告中每个问题必须包含准确的文件路径和行号"
    metric: issue_location_accuracy
    threshold: ">=95%"
    debtor_role: code-reviewer
