[project]
name = "{{APP_NAME}}"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "socialwares @ git+https://github.com/ezagent42/Socialwares.git",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
]
# 发布到 PyPI 后可改为: "socialwares>=0.2.0"

[tool.socialwares]
agent_dir = "agent"
adapter = "claude"
api_port = 8001

[tool.pytest.ini_options]
testpaths = ["tests"]
